<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" role="img" width="680" height="356">
  <title>How Outcome deposits are routed</title>

  <style>
    .hdr   { font: 600 9.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.1em; }
    .lead  { font: 650 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub   { font: 400 11.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .pill  { font: 600 10.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dest  { font: 700 15.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .dsub  { font: 400 11.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

    .ink   { fill: #0f172a; }
    .muted { fill: #64748b; }
    .faint { fill: #94a3b8; }
    .card  { fill: #ffffff; }
    .hair  { stroke: #e2e8f0; }

    @media (prefers-color-scheme: dark) {
      .ink   { fill: #f1f5f9; }
      .muted { fill: #94a3b8; }
      .faint { fill: #64748b; }
      .card  { fill: #ffffff; fill-opacity: 0.04; }
      .hair  { stroke: #ffffff; stroke-opacity: 0.12; }
    }
    :root[data-theme="dark"] .ink  { fill: #f1f5f9; }
    :root[data-theme="dark"] .muted{ fill: #94a3b8; }
    :root[data-theme="dark"] .faint{ fill: #64748b; }
    :root[data-theme="dark"] .card { fill: #ffffff; fill-opacity: 0.04; }
    :root[data-theme="dark"] .hair { stroke: #ffffff; stroke-opacity: 0.12; }
    :root[data-theme="light"] .ink  { fill: #0f172a; }
    :root[data-theme="light"] .muted{ fill: #64748b; }
    :root[data-theme="light"] .faint{ fill: #94a3b8; }
    :root[data-theme="light"] .card { fill: #ffffff; fill-opacity: 1; }
    :root[data-theme="light"] .hair { stroke: #e2e8f0; stroke-opacity: 1; }
  </style>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tip-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#eab308" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── Column headers ── -->
  <text class="hdr faint" x="20" y="16">WHAT YOU HAVE</text>
  <text class="hdr faint" x="392" y="16">HOW IT GETS THERE</text>

  <!-- ══ Row 1 — connected wallet ══ -->
  <g>
    <rect class="card hair" x="12" y="28" width="300" height="72" rx="14" stroke-width="1"/>
    <circle cx="52" cy="64" r="20" fill="#3b82f6" fill-opacity="0.12"/>
    <!-- wallet glyph -->
    <g transform="translate(41,54)" fill="none" stroke="#3b82f6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.5 4.2 A2.7 2.7 0 0 1 4.2 1.5 L17 1.5 A1.6 1.6 0 0 1 18.6 3.1 L18.6 5.2"/>
      <path d="M1.5 4.2 L1.5 16.4 A2.7 2.7 0 0 0 4.2 19.1 L17.4 19.1 A1.6 1.6 0 0 0 19 17.5 L19 7.6 A1.6 1.6 0 0 0 17.4 6 L4.2 6"/>
      <circle cx="14.6" cy="12.6" r="1.5" fill="#3b82f6" stroke="none"/>
    </g>
    <text class="lead ink" x="84" y="60">Crypto in your</text>
    <text class="lead ink" x="84" y="77">connected wallet</text>

    <line x1="322" y1="64" x2="366" y2="64" class="hair" stroke-width="1.6" marker-end="url(#tip)"/>

    <rect class="card hair" x="380" y="28" width="288" height="72" rx="14" stroke-width="1"/>
    <rect x="398" y="45" width="82" height="19" rx="9.5" fill="#3b82f6" fill-opacity="0.13"/>
    <text class="pill" x="439" y="58" text-anchor="middle" fill="#2563eb">Circle CCTP</text>
    <text class="sub muted" x="488" y="58">if you send USDC</text>
    <rect x="398" y="70" width="58" height="19" rx="9.5" fill="#3b82f6" fill-opacity="0.13"/>
    <text class="pill" x="427" y="83" text-anchor="middle" fill="#2563eb">Across</text>
    <text class="sub muted" x="464" y="83">for anything else</text>
  </g>

  <!-- ══ Row 2 — external wallet ══ -->
  <g>
    <rect class="card hair" x="12" y="112" width="300" height="72" rx="14" stroke-width="1"/>
    <circle cx="52" cy="148" r="20" fill="#a855f7" fill-opacity="0.12"/>
    <!-- coins-elsewhere glyph -->
    <g transform="translate(41,138)" fill="none" stroke="#a855f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="10.2" cy="4.6" rx="7.6" ry="3.1"/>
      <path d="M2.6 4.6 L2.6 15.4 C2.6 17.1 6 18.5 10.2 18.5 C14.4 18.5 17.8 17.1 17.8 15.4 L17.8 4.6"/>
      <path d="M2.6 10 C2.6 11.7 6 13.1 10.2 13.1 C14.4 13.1 17.8 11.7 17.8 10"/>
    </g>
    <text class="lead ink" x="84" y="144">Crypto held</text>
    <text class="lead ink" x="84" y="161">somewhere else</text>

    <line x1="322" y1="148" x2="366" y2="148" class="hair" stroke-width="1.6" marker-end="url(#tip)"/>

    <rect class="card hair" x="380" y="112" width="288" height="72" rx="14" stroke-width="1"/>
    <rect x="398" y="134" width="58" height="19" rx="9.5" fill="#a855f7" fill-opacity="0.13"/>
    <text class="pill" x="427" y="147" text-anchor="middle" fill="#9333ea">Across</text>
    <text class="sub muted" x="398" y="170">You send to an address we give you</text>
  </g>

  <!-- ══ Row 3 — cash ══ -->
  <g>
    <rect class="card hair" x="12" y="196" width="300" height="72" rx="14" stroke-width="1"/>
    <circle cx="52" cy="232" r="20" fill="#22c55e" fill-opacity="0.12"/>
    <!-- card glyph -->
    <g transform="translate(41,223)" fill="none" stroke="#22c55e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1.4" y="2.2" width="17.6" height="13.4" rx="2.4"/>
      <path d="M1.4 7 L19 7"/>
      <path d="M5 11.6 L8.6 11.6"/>
    </g>
    <text class="lead ink" x="84" y="228">A card or</text>
    <text class="lead ink" x="84" y="245">bank account</text>

    <line x1="322" y1="232" x2="366" y2="232" class="hair" stroke-width="1.6" marker-end="url(#tip)"/>

    <rect class="card hair" x="380" y="196" width="288" height="72" rx="14" stroke-width="1"/>
    <rect x="398" y="218" width="92" height="19" rx="9.5" fill="#22c55e" fill-opacity="0.13"/>
    <text class="pill" x="444" y="231" text-anchor="middle" fill="#16a34a">Swapped.com</text>
    <text class="sub muted" x="398" y="254">Handles payment and ID checks</text>
  </g>

  <!-- ── Converge rail ── -->
  <path d="M52 268 L52 288 Q52 298 62 298 L618 298 Q628 298 628 288 L628 268"
        class="hair" fill="none" stroke-width="1.4"/>
  <line x1="340" y1="298" x2="340" y2="318" stroke="#eab308" stroke-width="1.8" marker-end="url(#tip-gold)"/>

  <!-- ── Destination ── -->
  <rect x="152" y="326" width="376" height="26" rx="13" fill="#eab308" fill-opacity="0.13"/>
  <text class="dest ink" x="340" y="344" text-anchor="middle">USDC in your account, ready to trade</text>
</svg>
